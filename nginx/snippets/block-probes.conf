# Block common scanner, leak and WordPress abuse paths.
# Keep ACME challenge paths allowed elsewhere.

location ~* /(\.git|\.svn|\.hg|\.bzr) {
    return 403;
}

location ~* /(\.env|\.user.ini|composer\.(json|lock)|package-lock\.json|yarn\.lock) {
    return 403;
}

location ~* /(wp-config\.php|wp-config\.php\.save|wp-config\.bak|debug\.log) {
    return 403;
}

location = /xmlrpc.php {
    return 403;
}

location ~* /wp-json/wp/v2/users {
    return 403;
}

location ~* /(readme\.html|license\.txt) {
    return 403;
}

if ($args ~* "(^|&)author=\d+(&|$)") {
    return 403;
}

if ($args ~* "(^|&)rest_route=/wp/v2/users/?(&|$)") {
    return 403;
}
