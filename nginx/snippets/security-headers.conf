# Generic response headers that are safe for most applications.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disable legacy browser XSS auditors. Use a real CSP for XSS mitigation.
add_header X-XSS-Protection "0" always;

# Do not add includeSubDomains or preload unless every affected hostname is HTTPS-only.
add_header Strict-Transport-Security "max-age=31536000" always;

# Content-Security-Policy is intentionally not defined globally here.
# CSP must be adapted per application so that it can be strict without breaking required resources.
