# Example directives for the nginx `http {}` context.
# Adapt paths and trusted edge ranges before use.

log_format main '$remote_addr - $remote_user [$time_local] '
                '"$request" $status $body_bytes_sent '
                'rt=$request_time '
                '"$http_referer" "$http_user_agent" '
                '"$http_x_forwarded_for"';

# If nginx is behind a trusted edge/CDN, restore the original client address
# only from source networks that you explicitly trust.
#
# The ranges below are documentation-only placeholders and intentionally match
# no real provider. Replace them with the current ranges of your trusted edge.
set_real_ip_from 192.0.2.0/24;
set_real_ip_from 2001:db8::/32;

# Use the header documented by your edge provider. X-Forwarded-For is shown
# here as a generic example. Never trust forwarded client-IP headers globally.
real_ip_header X-Forwarded-For;
real_ip_recursive on;
